[package]
name = "jj-gt"
version = "0.1.0"
edition = "2024"
description = "A Graphite-style stacked-PR CLI built on jj-lib — demo for the JJCon talk \"Three Writes, Not One\""
publish = false

[[bin]]
name = "jj-gt"
path = "src/main.rs"

[dependencies]
# jj-lib from jj-vcs/jj PR #9300 ("WorkspaceOperationRunner"), rebased onto
# upstream main e6dd2c0d6. The branch lives in this repo as an orphan history:
# a squashed snapshot of upstream main followed by the 14 rebased PR commits.
jj-lib = { git = "https://github.com/lita/jj-gt.git", branch = "cursor-agent/jj-lib-pr-9300-rebased-500e" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
pollster = "0.4"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
itertools = "0.13"
tempfile = "3"
futures = "0.3"

[profile.dev]
debug = 0
